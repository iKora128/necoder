[package]
name = "host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/host.rs"

[[bin]]
name = "necoder-remote-server"
path = "src/bin/remote_server.rs"

[dependencies]
child_process.workspace = true
paths.workspace = true
anyhow.workspace = true
ignore.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
# 配備した remote-server の照合（sha256）・送る前の gzip・session id の乱数（docs/REMOTE-CHANNEL.md §3）。
sha2.workspace = true
flate2.workspace = true
getrandom.workspace = true

# 人が打ったコマンド（`run_user_command`）をプロセスグループごと止める `killpg`。
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# 起動後に変わったシステム / ユーザーの PATH をレジストリから読む（`refresh_search_path`）。
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
