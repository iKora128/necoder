[package]
name = "necoder"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "necoder" # `cargo run -p necoder` は本体を実行（hello は切り分け用の別 bin）

[features]
# 開発用ヘッドレススクショ（`cargo run -p necoder --features screenshot`）。
# gpui の render_to_image を test-support 経由で有効化し、Metal 描画結果を PNG 化する
# （screencapture 権限不要）。**通常ビルドには含めない**＝出荷バイナリに test-support を混ぜない。
screenshot = ["dep:image", "gpui/test-support", "gpui_platform/test-support"]
# フル Xcode の無い環境（Command Line Tools のみ）でローカルビルドするための逃げ道。
# gpui のシェーダを**実行時コンパイル**に切替え、ビルド時の `metal` コンパイラ（Xcode 同梱）を
# 不要にする。既定 off＝出荷/CI は従来どおり事前コンパイル（起動が僅かに速い）。
# `bundle-mac.sh` が `metal` 不在を検知した時だけ自動で付ける（手動なら --features runtime-shaders）。
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
paths.workspace = true
cli_shim.workspace = true
# `necoder skills …`（エージェント向け skill の配布と一覧。設定画面と共有）
agent_skills.workspace = true
anyhow.workspace = true
gpui.workspace = true
# font-kit = macOS のグリフ（文字）ラスタライズ。**これが無いと四角は出るが文字が全く描画されない**
# （gpui の example も font-kit 付きで動いている）。
gpui_platform = { workspace = true, features = ["font-kit"] }
workspace.workspace = true
# 終了時に ACP の子プロセスを道連れにする（app.run の後の保険）。
acp_client.workspace = true
editor_view.workspace = true
theme_core.workspace = true
i18n.workspace = true
keymap_core.workspace = true
settings_core.workspace = true
settings.workspace = true
project.workspace = true
futures.workspace = true
host.workspace = true
# 調査用: NECODER_WGPU_LOG=1 で gpui/wgpu のログを stderr へ出す（既定は無効）。
log = "0.4"
search.workspace = true
storage.workspace = true
serde_json.workspace = true
# Finder/Dock から届く file:// URL の解釈（on_open_urls → パス化。percent-decode 込み）
url.workspace = true
image = { workspace = true, optional = true }

# Linux の表示バックエンドは既定で両方含める。gpui_platform の既定 feature は空で、
# 有効化しないと cargo check が通っても Desktop 上の起動時に panic する。
# target を限定し、macOS / Windows の描画 feature は変えない。
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

# Dock / AppleScript の「終了」を ⌘Q と同じ確認へ回すフック（quit_hook.rs・O4）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
