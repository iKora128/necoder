[package]
name = "webview_view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/webview_view.rs"

[dependencies]
gpui.workspace = true
i18n.workspace = true
theme_core.workspace = true
url.workspace = true

# WebView エンジンは同梱しない。macOS は WKWebView、Windows は WebView2 を使う。
# Linux で wry を有効にすると WebKitGTK/GTK が必要になるため、軽量性を守って対象外にする。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "=0.56.1", default-features = false }
