[package]
name = "webview_view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/webview_view.rs"

[dependencies]
futures.workspace = true
gpui.workspace = true
i18n.workspace = true
theme_core.workspace = true
url.workspace = true

# WebView エンジンは同梱しない。macOS は WKWebView、Windows は WebView2 を使う。
# Linux で wry を有効にすると WebKitGTK/GTK が必要になるため、軽量性を守って対象外にする。
# `devtools`: release ビルドでもプレビューの右クリック →「要素を検証」（Web Inspector）を使えるようにする。
# macOS では WKPreferences の私的キー `developerExtrasEnabled` を叩くため App Store 配布には不向きだが、
# necoder は DMG/GitHub 配布なので採用（debug ビルドでは feature 無しでも常に有効）。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
wry = { version = "=0.56.1", default-features = false, features = ["devtools"] }

# macOS の Web タブ: wry の navigation delegate を包んで移動判定を最上位だけにする（`main_frame.rs`）。
# 版は wry が引いている物に揃える（Cargo.lock の同じ版を共有して二重にビルドしない）。
# feature は使う物だけ（既定の全部入りはビルドが重い）。
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSObject", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "objc2-core-foundation",
  "WKDownload",
  "WKFrameInfo",
  "WKNavigation",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKNavigationResponse",
  "WKWebView",
] }
