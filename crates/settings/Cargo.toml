[package]
name = "settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/settings.rs"

[features]
remote-preview = ["gpui/test-support", "gpui_platform/test-support"]

[dev-dependencies]
gpui_platform.workspace = true

[[example]]
name = "remote_preview"
required-features = ["remote-preview"]

# 設定ホーム全体を 1 枚に描く（セクション追加時のレイアウト目視）。offscreen 描画に
# gpui の test-support が要るので `remote-preview` と同じ feature に相乗りする。
[[example]]
name = "settings_preview"
required-features = ["remote-preview"]

[dependencies]
acp_client.workspace = true
anyhow.workspace = true
cli_shim.workspace = true
gpui.workspace = true
i18n.workspace = true
settings_core.workspace = true
serde_json.workspace = true
theme_core.workspace = true
