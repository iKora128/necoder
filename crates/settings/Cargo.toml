[package]
name = "settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/settings.rs"

[features]
remote-preview = ["gpui/test-support", "gpui_platform/test-support"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true

[[example]]
name = "remote_preview"
required-features = ["remote-preview"]

# 設定ホーム全体を 1 枚に描く（セクション追加時のレイアウト目視）。offscreen 描画に
# gpui の test-support が要るので `remote-preview` と同じ feature に相乗りする。
[[example]]
name = "settings_preview"
required-features = ["remote-preview"]

[dependencies]
acp_client.workspace = true
# Skills 節（エージェントの skill 置き場の一覧と necoder の skill の設置。CLI と共有）
agent_skills.workspace = true
anyhow.workspace = true
cli_shim.workspace = true
# 設定の検索欄（O27・IME の正しい 1 行入力）
editor_view.workspace = true
gpui.workspace = true
i18n.workspace = true
settings_core.workspace = true
serde_json.workspace = true
theme_core.workspace = true
