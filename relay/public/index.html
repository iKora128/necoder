<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17181b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="necoder">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <title>necoder · Remote</title>
</head>
<body>
  <header><a class="brand" href="/">necoder <span>Remote</span></a><select id="language" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option></select></header>
  <main>
    <section id="welcome" class="welcome">
      <p class="eyebrow" data-t="eyebrow"></p><h1 data-t="welcome"></h1><p data-t="intro"></p>
      <ol><li data-t="install"></li><li data-t="pairHelp"></li><li data-t="pairHint"></li></ol>
      <form id="pair-form"><label for="pair-url" data-t="pairUrl"></label><input id="pair-url" type="url" autocomplete="off" spellcheck="false" placeholder="https://control.necoder.com/#…"><button type="submit" data-t="connect"></button></form>
      <p class="hint" data-t="privacy"></p>
    </section>
    <section id="control" hidden>
      <div class="connection"><label for="hosts" class="sr-only" data-t="host"></label><select id="hosts"></select><span id="status" role="status"></span><button id="reconnect" data-t="reconnect"></button></div>
      <p id="last-seen" class="hint"></p>
      <nav class="tools"><button id="notifications" data-t="notifications"></button><button id="forget" data-t="forget"></button></nav>
      <label for="projects" data-t="project"></label><select id="projects"></select>
      <div class="thread-heading"><h2 data-t="threads"></h2><button id="new-thread" data-t="newThread"></button></div>
      <div id="threads" class="threads"></div>
      <section id="thread-view" hidden>
        <div class="destination"><span id="destination"></span><span id="tokens"></span></div>
        <div id="permission"></div><div id="question"></div>
        <div class="thread-actions"><button id="diff" data-t="diff"></button><button id="interrupt" data-t="interrupt"></button></div>
        <div id="transcript" aria-live="off"></div>
        <form id="composer"><label for="message" data-t="message"></label><textarea id="message" rows="3" maxlength="8000"></textarea><div class="composer-footer"><span id="receipt" role="status"></span><button id="send" type="submit" data-t="send"></button></div></form>
      </section>
    </section>
    <div id="notice" role="status" hidden></div>
    <dialog id="diff-dialog"><div class="dialog-head"><h2 data-t="diff"></h2><button id="close-diff" data-t="close"></button></div><p data-t="diffHint"></p><pre id="diff-text"></pre></dialog>
  </main>
  <footer><span data-t="footer"></span><a href="/source.tar.gz" data-t="source"></a></footer>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
