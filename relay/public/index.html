<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16181e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="necoder">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <title>necoder · Remote</title>
</head>
<body data-status="offline">
  <!-- 未ペアリング: ホーム画面への追加と QR の読み取り -->
  <section id="welcome" hidden>
    <header class="bar"><div class="bar-title"><span class="brand">necoder <small>Remote</small></span></div>
      <select id="language" class="compact" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option></select></header>
    <div class="welcome">
      <p class="eyebrow" data-t="eyebrow"></p><h1 data-t="welcome"></h1><p data-t="intro"></p>
      <ol><li data-t="install"></li><li data-t="pairHelp"></li></ol>
      <button id="scan" class="primary" data-t="scan"></button>
      <p id="scan-error" class="hint" role="status"></p>
      <details id="pair-manual"><summary data-t="pairManual"></summary>
        <form id="pair-form"><label for="pair-url" data-t="pairUrl"></label><input id="pair-url" type="url" autocomplete="off" spellcheck="false" placeholder="https://control.necoder.com/#…"><button type="submit" data-t="connect"></button></form>
      </details>
      <p class="hint" data-t="privacy"></p>
    </div>
    <footer class="legal"><span data-t="footer"></span><a href="/source.tar.gz" data-t="source"></a></footer>
  </section>

  <!-- ホーム: 共有中の全プロジェクトのスレッド一覧（要対応・実行中を先頭に） -->
  <section id="home" hidden>
    <header class="bar">
      <div class="bar-title"><span class="brand">necoder</span><span id="host-name" class="bar-sub"></span></div>
      <span id="status" class="status" role="status"></span>
      <button id="open-settings" class="icon-button" type="button" data-aria="settings"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </header>
    <main id="home-list" class="home-list"></main>
  </section>

  <!-- スレッド: 会話を読む・指示する・承認する -->
  <section id="thread-view" hidden>
    <header class="bar">
      <button id="back" class="icon-button back" type="button" data-aria="back"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span id="back-badge" class="badge" hidden></span></button>
      <div id="destination" class="bar-title"><span id="thread-name" class="thread-name"></span><span class="bar-sub"><span id="thread-project" class="project-chip"></span><span id="thread-meta"></span></span></div>
      <button id="diff" class="chip" type="button" data-t="changes"></button>
    </header>
    <div id="connection-banner" class="banner" role="status" hidden></div>
    <main id="transcript" class="transcript" aria-live="off"></main>
    <div id="permission"></div><div id="question"></div>
    <button id="to-latest" class="to-latest" type="button" data-aria="toLatest" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg></button>
    <form id="composer" class="composer">
      <label for="message" class="sr-only" data-t="message"></label>
      <textarea id="message" rows="1" maxlength="8000" enterkeyhint="enter"></textarea>
      <div class="composer-row"><span id="receipt" role="status"></span><button id="interrupt" class="chip" type="button" data-t="interrupt" hidden></button><button id="send" class="send" type="submit" data-t="send"></button></div>
    </form>
  </section>

  <div id="notice" role="status" hidden></div>

  <dialog id="settings-dialog" class="sheet">
    <div class="sheet-head"><h2 data-t="settings"></h2><button id="close-settings" class="chip" type="button" data-t="close"></button></div>
    <label for="hosts" data-t="host"></label><select id="hosts"></select>
    <p class="settings-status"><span id="settings-status"></span><span id="last-seen"></span></p>
    <div class="sheet-actions"><button id="reconnect" type="button" data-t="reconnect"></button><button id="notifications" type="button" data-t="notifications"></button></div>
    <label for="language-settings" data-t="language"></label>
    <select id="language-settings"><option value="ja">日本語</option><option value="en">English</option></select>
    <button id="forget" class="danger" type="button" data-t="forget"></button>
    <footer class="legal"><span data-t="footer"></span><a href="/source.tar.gz" data-t="source"></a></footer>
  </dialog>
  <dialog id="agent-dialog" class="sheet">
    <div class="sheet-head"><h2 data-t="newThread"></h2><button id="close-agent" class="chip" type="button" data-t="close"></button></div>
    <p id="agent-project" class="hint"></p>
    <div id="agent-choices" class="agent-choices"></div>
  </dialog>
  <dialog id="scan-dialog"><div class="sheet-head"><h2 data-t="scan"></h2><button id="close-scan" class="chip" type="button" data-t="close"></button></div>
    <video id="scan-video" playsinline muted autoplay></video><p class="hint" data-t="scanHint"></p></dialog>
  <dialog id="diff-dialog" class="sheet tall"><div class="sheet-head"><h2 data-t="diff"></h2><button id="close-diff" class="chip" type="button" data-t="close"></button></div>
    <p class="hint" data-t="diffHint"></p><pre id="diff-text"></pre></dialog>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
