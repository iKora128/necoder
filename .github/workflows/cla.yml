name: CLA

# 外部貢献の最初の 1 件から CLA 必須（DECISIONS §5 の鉄則）。
# contributor-assistant: 未署名の PR にコメントで案内し、指定の一文コメントで署名を記録する。
# 署名は同リポジトリの cla-signatures ブランチ（signatures/version1/cla.json）に貯まる。
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # コメントイベントは署名文（または再チェック指示）のときだけ処理する
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/iKora128/shirushi/blob/main/CLA.md"
          branch: "cla-signatures"
          allowlist: "iKora128,dependabot[bot]"
          custom-notsigned-prcomment: >
            Thank you for the contribution! Before we can merge, please read the
            [CLA](https://github.com/iKora128/shirushi/blob/main/CLA.md) and sign it by posting the
            comment below. / コントリビュートありがとうございます。マージ前に
            [CLA](https://github.com/iKora128/shirushi/blob/main/CLA.md) を読み、下の一文を
            コメントして署名してください。
