name: Remote control
on:
  push:
    paths: ['relay/**', '.github/workflows/remote-control.yml']
  pull_request:
    paths: ['relay/**', '.github/workflows/remote-control.yml']
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - if: runner.os == 'macOS'
        run: npx playwright install chromium webkit
      - if: runner.os == 'macOS'
        run: npm run test:browser
      # 落ちた時の Playwright trace（playwright.config の retain-on-failure）を持ち帰る。
      # 2026-09-14 はこれが無く、trace を見られないまま 5 コミット手探りした。
      - if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: relay/test-results/
          if-no-files-found: ignore
          retention-days: 14
