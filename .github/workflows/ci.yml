name: CI

# push/PR ごとの検証（M13）:
#  - mac: cargo test 全 crate + 編集コアの性能予算ガード（examples/bench_editor）
#  - linux: ビルドのみ（GPUI Linux の依存を入れて `cargo check`。安定するまで best-effort）
# 起動時間（scripts/startup-time.sh）と入力レイテンシ（key→frame）は GUI 実機が要るため
# CI では回さない（ROADMAP M13 残件参照・ローカル計測用スクリプトはある）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # toolchain は rust-toolchain.toml（1.95.0）で固定 → rustup が自動取得。
      - uses: Swatinem/rust-cache@v2
      - name: Test（全 crate）
        run: cargo test --workspace
      - name: 性能予算ガード（編集コア・release）
        run: cargo run --release -p editor_core --example bench_editor

  check-windows:
    runs-on: windows-latest
    # W5（WINDOWS-PORT.md §3）: Windows の退行を PR で機械的に止める。
    #
    # release.yml にも windows ジョブはあるが、あれは **タグ push か手動でしか走らない** ＝
    # PR を止められない。「以後の退行を機械が止める」にはこちらが要る。
    #
    # 2026-08-22 に W1（paths crate）+ W2（IPC 抽象・警告 0）を通して
    # `cargo test --workspace` が Windows 実機で green になったので必須ジョブにできる。
    # 落としてよい理由が無い＝ continue-on-error は付けない。
    steps:
      # checkout **より前**に改行変換を切る。Windows ランナーの Git は core.autocrlf=true が
      # 既定で、そのまま checkout すると作業ツリーが CRLF になる（WINDOWS-PORT.md §4）。
      - name: 改行変換を切る（checkout より前）
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Check（警告もエラー扱い）
        run: cargo check --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - name: Test（全 crate）
        run: cargo test --workspace
      # scripts/*.ps1 は **UTF-8 BOM 付き**でなければならない。Windows PowerShell 5.1 は
      # BOM の無いファイルをシステム ANSI（日本語環境では Shift-JIS）として読むため、
      # 日本語コメントが化けて構文ごと壊れる（2026-08-22 に実際に踏んだ）。
      # 編集ツールは BOM を落とすことがあるので機械で止める。
      # **`shell: powershell`（5.1）で回すこと** — 既定の pwsh(7) は BOM 無しでも読めてしまい、
      # このチェックが意味を失う。
      - name: PowerShell スクリプトの構文チェック（5.1 で読めるか＝BOM の有無）
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "::error::$($_.Name) が Windows PowerShell 5.1 で解釈できない（UTF-8 BOM が無い可能性）"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  audit-deps:
    runs-on: ubuntu-latest
    # 依存のライセンス互換 / 出所 / RUSTSEC 勧告の機械監査（deny.toml が正・M13 公開準備）。
    # AGPL 配布物として「依存は permissive のみ」を人力でなく CI で保証する。
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  check-linux:
    runs-on: ubuntu-latest
    # GPUI Linux（Wayland/X11）の追従は M13 残件 — 落ちても mac の検証は止めない。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: GPUI Linux の依存
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libxcb1-dev libzstd-dev libasound2-dev libfontconfig1-dev libssl-dev
      - name: Check（ビルド可否のみ）
        run: cargo check -p necoder

  build-remote-server:
    runs-on: ubuntu-latest
    # remote SSH 用の Linux musl サーバーバイナリ（#1・旧 M9 / M13 残件）。
    # static-musl = glibc 依存なしでどの Linux でも動く。cargo-zigbuild は zig を linker に使い
    # x86_64/aarch64 の musl クロスを追加ツール無しで通す。host crate は GPUI 非依存なので軽い。
    # 初回 CI 実行で追従修正の可能性あり（check-linux と同じ扱い）。将来 GitHub Release へ添付予定。
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Zig + cargo-zigbuild + target
        run: |
          pip install ziglang cargo-zigbuild
          rustup target add ${{ matrix.target }}
      - name: Build necoder-remote-server
        run: cargo zigbuild -p host --bin necoder-remote-server --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: necoder-remote-server-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/necoder-remote-server
