[workspace]
resolver = "2"
members = ["crates/*"]
# zed/ は参照用クローン（独立ワークスペース）。path 依存の解決のため除外指定
exclude = ["zed"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
# GPUI はリポジトリ内の Zed クローンを path 参照（API の正は zed/ の現行ソース）。
# 安定フェーズで git rev 固定へ移行する（docs/DECISIONS.md 参照）
# GPUI は zed リポジトリ内に住む（単体 crates.io 版は無い）ので、git 依存で rev 固定。
# path 依存（gitignore 済みの ./zed）だと CI が clone してもビルド不能なため。rev はローカル
# zed clone と一致必須（GPUI は API churn が激しい）。更新はユーザー判断で追従修正とセット。
gpui = { git = "https://github.com/zed-industries/zed", rev = "b2d9c2e122fbc408d42276b4456243ba4f90f181", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "b2d9c2e122fbc408d42276b4456243ba4f90f181", package = "gpui_platform" }
# バージョン制約は zed/Cargo.toml に揃える（既に lock 済みの版を共有してビルドを重複させない）
anyhow = "1.0.86"
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf", "metric_utf16"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ignore = "0.4"
regex = "1"
url = "2"
# git gutter diff（HEAD vs バッファの行差分）。Zed も同じ（純 Rust・libgit2 不使用）
imara-diff = "0.1.8"
# チャット本文の markdown 解析（M4）。純 Rust・MIT・CommonMark+GFM。イベント列を自作レンダラで
# GPUI 要素へ落とす（Zed の markdown crate は GPL のため移植せず手法のみ参考・DECISIONS §5）。
# default-features off で CLI 用の getopts を外す（Zed と同じ）。
pulldown-cmark = { version = "0.13", default-features = false }
# tree-sitter（M7 ハイライト）。links=tree-sitter は 1 版のみ許容 → highlight 0.25 に揃える
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
# M11 多言語ハイライト（grammar crate は tree-sitter-language shim 経由で core 版と疎結合）
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
# Markdown は block/inline の 2 grammar 構成。0.5.1 は LanguageFn 経由で tree-sitter 0.25 と共存する。
# `parser` feature は tree-sitter 0.24 を直接引くため有効にせず、薄い統合層を lang 側に置く。
tree-sitter-md = "=0.5.1"
# M4 ACP: Claude Code を ACP で包む。1.3 で ChildGuard drop 時にエージェントのプロセス
# グループごと kill・stderr キャプチャのメモリ上限・EOF 処理修正（孤児プロセス/メモリ膨張の根治）。
# 2.0 は wire schema(v1) 不変だが Rust API が breaking（AcpAgentConfig 化等）＝別途追従判断。
agent-client-protocol = "1.3"
blocking = "1"
futures = "0.3"
async-io = "2"
# 自前ヘッドレススクショ用（gpui の render_to_image が image::RgbaImage を返す）
image = "0.25"
# M8 統合ターミナル。crates.io 0.26 は Zed fork(0.26.1-dev)とほぼ同一 API
alacritty_terminal = "0.26"
libc = "0.2"
# M10 ファイル監視（macOS は FSEvents バックエンド）。remote watch は M13 で Host 経由に
notify = "8"
# ローカル永続化 DB（hot exit / スレッド / 台帳。DECISIONS 決定ログ 2026-07-16・pure-Rust SQLite）
turso = "0.7"

# 自作 crate（作る順は docs/ARCHITECTURE.md §2）
theme_core = { path = "crates/theme_core" }
i18n = { path = "crates/i18n" }
editor_core = { path = "crates/editor_core" }
editor_view = { path = "crates/editor_view" }
explorer = { path = "crates/explorer" }
git_ui = { path = "crates/git_ui" }
settings_core = { path = "crates/settings_core" }
settings = { path = "crates/settings" }
keymap_core = { path = "crates/keymap_core" }
project = { path = "crates/project" }
host = { path = "crates/host" }
search = { path = "crates/search" }
search_ui = { path = "crates/search_ui" }
storage = { path = "crates/storage" }
lang = { path = "crates/lang" }
markdown = { path = "crates/markdown" }
acp_client = { path = "crates/acp_client" }
agent_panel = { path = "crates/agent_panel" }
ui = { path = "crates/ui" }
terminal_view = { path = "crates/terminal_view" }
workspace = { path = "crates/workspace" }

# ビルド成果物の容量対策（2026-07-25）。cargo 既定の debug = 2（フルデバッグ情報）だと
# GPUI 級の依存ツリーで target/debug が 95GB まで膨らんだ（deps 50GB + incremental 43GB の実測）。
# 設定は zed/Cargo.toml に揃える（あちらは最初からこの構成）。
# debug = "limited" でも行番号付きバックトレースは残る。変数の値まで追う時だけ --profile dbg を使う。
[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

# ビルドスクリプト/proc-macro 側も同じ設定に揃える。揃えないと同一 crate を 2 回コンパイルする
[profile.dev.build-override]
split-debuginfo = "unpacked"
codegen-units = 16
debug = "limited"

# "debug" は cargo の予約名なので dbg。本格デバッグ用: cargo run --profile dbg -p necoder
[profile.dbg]
inherits = "dev"
debug = "full"

[profile.dbg.build-override]
debug = "full"
