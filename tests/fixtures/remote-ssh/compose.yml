services:
  ssh:
    image: necoder-remote-ssh-test:local
    build:
      context: .
    environment:
      AUTHORIZED_KEY_FILE: /run/necoder/id_ed25519.pub
    volumes:
      - type: bind
        source: ${NECODER_REMOTE_TEST_PUBLIC_KEY:?set by scripts/test-remote-ssh-docker.sh}
        target: /run/necoder/id_ed25519.pub
        read_only: true
    ports:
      - "127.0.0.1::22"
    healthcheck:
      test: ["CMD-SHELL", "sshd -t && pgrep -x sshd >/dev/null"]
      interval: 1s
      timeout: 2s
      retries: 20
