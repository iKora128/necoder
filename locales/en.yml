captain:
  log: "Decision log"
  human_gate: "Coordination only · Integration and approvals require a human"
  ledger_source: "ledger"
  title: Captain
  appoint: "Not appointed — click to appoint"
  appoint_tab: "Appoint a Captain"
  tab_tip: "Go to the Captain (the coordinator living on main) · ⌘0"
  appoint_title: "Appoint a Captain"
  appoint_body: "The Captain is a coordinator that lives on main. Give it a goal and it splits the work into Tasks (worktrees), starts them, watches for done / failed / waiting, and reports back. It never writes code itself. Any agent can serve, and you can replace or dismiss it later in Settings."
  appoint_no_agent: "No agent is available. Sign in under Settings → Agents."
  log_empty: "No decisions yet. Give the Captain a goal and its decisions will be listed here."
  role: |
    You are the Captain of the necoder fleet.
    Role: read the situation, decide the next move, and direct the fleet with the fleet tools of the MCP server necoder. When a human hands you a goal, split it into Tasks and propose them.
    Discipline:
    - Never write code, edit files, or use the shell yourself. necoder refuses them in this seat.
    - Propose new Tasks with fleet_propose_tasks. necoder creates branches and worktrees only for what the human approves. The approval or rejection arrives with the next update, so end this turn without waiting.
    - For an approved Task, necoder starts the agent and sends the goal and done condition as its first instruction. Do not start it again (the Task would get two agents).
    - Give every proposed row a goal and a done condition. Merge work whose areas overlap into one Task. Even a single piece of work becomes a Task you delegate.
    - Following up on an existing Task (fleet_send) and adding an agent to it (fleet_spawn_agent) need no confirmation.
    - Agents report their own phase; you never rewrite it. Integration belongs to the human — you go as far as checking the radar with fleet_review_task and proposing.
    How to proceed: first read the situation with fleet_list_tasks and fleet_digest, make only the moves that are needed, and close with a 1-3 line summary of your judgement. If nothing needs doing, answer with just: standing by.
  facts: "Current state (Tasks in this repository · id | name | phase | digest):"
  recent: "Recent decisions (oldest first):"
  wake_header: "New ledger events since last time (#seq Task-id title: what happened):"
  wake_omitted: "(%{n} older events left out — read them with fleet_events)"
  line_created: "Task created"
  line_human_send: "the human instructed directly: “%{text}”"
  line_approved: "proposal approved — necoder created the Tasks and started their agents (first instructions already sent). Created: %{approved} / left out: %{skipped}"
  line_rejected: "proposal rejected (nothing was created)"
  rotated: "Conversation rotated (the state and recent decisions come in the preamble)"
  retired_name: "Captain (%{agent} · before the change)"
  seat_denied: "⚑ Not allowed in the Captain seat, refused:"
  seat_violation: "⚑ Edited without asking in the Captain seat, stopped:"
  seat_violation_news: "Stopped an unapproved edit in the Captain seat (%{tool})"
  proposal_title: "⚑ Captain's split · %{n} Tasks"
  proposal_goal: "Goal: %{text}"
  proposal_done_when: "Done when: %{text}"
  proposal_scope: "Scope: %{text}"
  proposal_approve: "Approve (create %{n})"
  proposal_reject: "Reject"
  proposal_pending_reply: "Waiting for the human's approval. Once approved, necoder creates the Tasks, starts their agents and sends their first instructions (you do not start them). The result arrives with the next update, so end this turn without waiting."
  proposal_err_tasks: "List at least one Task in tasks (title / goal / done_when are required)"
  proposal_err_too_many: "A proposal holds at most %{max} Tasks. Splitting too finely slows work down through sequential dependencies, so combine them"
  proposal_err_field: "Row %{row} is missing %{field} (title / goal / done_when are required)"
  proposal_err_agent: "Row %{row}: agent %{agent} is not available (available: %{known})"
