  delegation: |
    %{title}

    Goal: %{goal}
    Done when: %{done_when}
    When the done condition holds, finish by summarizing what you changed in 3 sentences.
  delegation_scope: "Scope: %{scope}"
  recommend_allow: "OK to allow"
  recommend_deny: "Suggest denying"
  recommend_ask_human: "Your call"
  recommend_card: "Captain: %{verdict}"
  recommend_news: "Recommendation · %{task}: %{verdict} — %{reason}"
  recommend_reply: "Added to the Attention card (a line for the human to read). The human presses allow or deny, so you do not answer the request. End this turn without waiting."
  recommend_wake_header: "Waiting for approval (a Task's agent stopped to ask for permission; requests you have not recommended on yet). For a request you can judge, you may return one line with fleet_recommend (task_id, permission_id, verdict = allow / deny / ask_human, a one-line reason). Do not answer it — the human presses allow or deny:"
